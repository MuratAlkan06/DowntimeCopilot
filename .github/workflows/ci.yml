name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Secret and probe guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/guard.sh

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Pinned install set (generated from Makefile DEPS by `make lock` under 3.12).
          cache-dependency-path: requirements.lock
      - name: Install dependencies (pip install -r requirements.lock via make setup)
        run: make setup
      - name: Run tests (mock mode)
        run: DRY_RUN=1 make test
