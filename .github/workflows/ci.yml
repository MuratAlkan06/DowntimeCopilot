name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Secret and probe guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/guard.sh

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # No requirements.txt: the dependency list lives in the Makefile (DEPS).
          cache-dependency-path: Makefile
      - name: Install dependencies
        run: make setup
      - name: Run tests (mock mode)
        run: DRY_RUN=1 make test
